# Template Konfigurasi Nginx untuk VPS (API Backend + AI Agent)
# Simpan di: /etc/nginx/sites-available/nebeng-api.conf
# Aktifkan:  sudo ln -s /etc/nginx/sites-available/nebeng-api.conf /etc/nginx/sites-enabled/
# SSL:       sudo certbot --nginx -d api.domain-anda.com

limit_req_zone $binary_remote_addr zone=nebeng_public_limit:10m rate=10r/s;

server {
    listen 80;
    server_name api.domain-anda.com;

    # Ukuran upload maksimal (misal foto KTP/SIM/lokasi pos saat registrasi mitra)
    client_max_body_size 10M;

    # 1. Backend API (NestJS / Node.js di port 3000)
    location /api/ {
        limit_req zone=nebeng_public_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;

        # Support WebSocket / Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 2. AI Agent Service (Opsional: port 8000 / 5678 / sesuai service AI Agent di VPS)
    location /agent/ {
        limit_req zone=nebeng_public_limit burst=15 nodelay;

        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout lebih panjang untuk respons AI Agent / streaming
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
